<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Morning Check-in Modal -->
  <div id="checkin-overlay" class="hidden">
    <div id="checkin-modal">
      <div class="checkin-header">
        <div class="checkin-icon"></div>
        <h2>Daily Check-in</h2>
        <p id="checkin-subtitle"></p>
      </div>
      <div id="checkin-list"></div>
      <div class="checkin-footer">
        <button id="checkin-start" class="btn-primary" disabled>Decide all tasks to continue</button>
      </div>
    </div>
  </div>

  <header>
    <div class="header-nav">
      <button id="prev-week" class="nav-btn" aria-label="Previous week">&#8592;</button>
      <div class="header-center">
        <h1 id="week-label"></h1>
        <button id="today-btn" class="today-btn">Today</button>
      </div>
      <button id="next-week" class="nav-btn" aria-label="Next week">&#8594;</button>
    </div>
  </header>

  <main>
    <div id="week-grid"></div>
    <section id="notes-section">
      <div class="notes-label">Week Notes</div>
      <textarea id="week-notes" placeholder="Anything to keep in mind this week…"></textarea>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
